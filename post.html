<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - TechBlog</title>
    <meta name="description" content="技术文章详情页，阅读更多关于前端开发、后端架构的内容。">
    <meta name="keywords" content="技术文章, 前端开发, 后端开发, 编程心得">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://github.com/Huanglh337/hlhdemo/post.html">
    <meta property="og:title" content="文章详情 - TechBlog">
    <meta property="og:description" content="技术文章详情页，阅读更多关于前端开发、后端架构的内容。">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="文章详情 - TechBlog">
    <meta property="twitter:description" content="技术文章详情页，阅读更多关于前端开发、后端架构的内容。">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="主导航">
        <div class="nav-container">
            <a href="index.html" class="nav-logo" aria-label="TechBlog 首页">TechBlog</a>
            <ul class="nav-menu" role="menubar">
                <li role="none"><a href="index.html" class="nav-link" role="menuitem">首页</a></li>
                <li role="none"><a href="about.html" class="nav-link" role="menuitem">关于</a></li>
            </ul>
            <button class="hamburger" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-menu">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>
        </div>
    </nav>

    <main class="container" role="main">
        <article class="post-detail" aria-labelledby="post-title">
            <header class="post-header">
                <h1 id="post-title">文章标题</h1>
                <div class="post-meta">
                    <span id="post-date">日期</span>
                    <span id="post-category">分类</span>
                </div>
            </header>
            <div id="post-content" class="post-content" role="article">
                <!-- 文章内容将通过 JS 动态生成 -->
            </div>
            <footer class="post-footer">
                <a href="index.html" class="back-link" aria-label="返回文章列表">← 返回首页</a>
            </footer>
        </article>
    </main>

    <footer class="footer" role="contentinfo">
        <div class="footer-content">
            <p>&copy; 2026 TechBlog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/posts.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
