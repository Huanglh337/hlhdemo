<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 - TechBlog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">TechBlog</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">首页</a></li>
                <li><a href="about.html" class="nav-link">关于</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="container">
        <article class="post-detail">
            <header class="post-header">
                <h1 id="post-title">文章标题</h1>
                <div class="post-meta">
                    <span id="post-date">日期</span>
                    <span id="post-category">分类</span>
                </div>
            </header>
            <div id="post-content" class="post-content">
                <!-- 文章内容将通过 JS 动态生成 -->
            </div>
            <footer class="post-footer">
                <a href="index.html" class="back-link">← 返回首页</a>
            </footer>
        </article>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 TechBlog. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/posts.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
